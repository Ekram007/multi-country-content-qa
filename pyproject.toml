[project]
name = "content-qa"
version = "0.1.0"
description = "Multi-Country Content Q&A with Citations"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "qdrant-client",
    "sentence-transformers",
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "langchain-google-genai",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
