services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      # Official image has no curl; TCP open check is enough for readiness
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "9000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Ingest corpus into Qdrant before API (same as: uv run python -m src.run_ingest)
      - RUN_INGEST_ON_START=true
      # false = faster restarts (upsert only); true = drop collection and rebuild
      - INGEST_RECREATE=false
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  qdrant_storage:
